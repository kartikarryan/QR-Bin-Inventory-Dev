<div class="shell">
  <header class="app-header">
    <div class="header-left">
      <button type="button" class="hamburger" (click)="toggleSidebar()" aria-label="Toggle navigation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="2" width="7" height="7" rx="1.5" stroke="white" stroke-width="2" />
            <rect x="15" y="2" width="7" height="7" rx="1.5" stroke="white" stroke-width="2" />
            <rect x="2" y="15" width="7" height="7" rx="1.5" stroke="white" stroke-width="2" />
            <rect x="15" y="15" width="3" height="3" fill="white" />
            <rect x="19" y="15" width="3" height="3" fill="white" />
            <rect x="15" y="19" width="3" height="3" fill="white" />
          </svg>
        </span>
        <span class="brand-name">QR Bin Inventory</span>
      </div>
    </div>

  </header>

  <div class="shell-body">
    @if (sidebarOpen()) {
      <div class="sidebar-backdrop" (click)="closeSidebar()"></div>
    }

    <nav class="sidebar" [class.open]="sidebarOpen()">
      <div class="nav-main">
        <a routerLink="/billing" routerLinkActive="active" (click)="closeSidebar()">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z" />
              <line x1="9" y1="8" x2="15" y2="8" />
              <line x1="9" y1="12" x2="15" y2="12" />
            </svg>
          </span>
          Billing
        </a>
        <a routerLink="/stock" routerLinkActive="active" (click)="closeSidebar()">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 8 12 3 3 8l9 5 9-5Z" />
              <path d="M3 8v8l9 5 9-5V8" />
              <path d="M12 13v8" />
            </svg>
          </span>
          Stock
        </a>
        <a routerLink="/products" routerLinkActive="active" (click)="closeSidebar()">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.59 2.59A2 2 0 0 0 11.17 2H4a2 2 0 0 0-2 2v7.17a2 2 0 0 0 .59 1.41l8.7 8.7a2.43 2.43 0 0 0 3.42 0l6.59-6.59a2.43 2.43 0 0 0 0-3.42Z" />
              <circle cx="7.5" cy="7.5" r="1" fill="currentColor" stroke="none" />
            </svg>
          </span>
          Products
        </a>
      </div>
    </nav>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
