<div class="shell">
  <header class="app-header">
    <div class="header-left">
      <button type="button" class="hamburger" (click)="toggleSidebar()" aria-label="Toggle navigation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="2" width="7" height="7" rx="1.5" stroke="white" stroke-width="2" />
            <rect x="15" y="2" width="7" height="7" rx="1.5" stroke="white" stroke-width="2" />
            <rect x="2" y="15" width="7" height="7" rx="1.5" stroke="white" stroke-width="2" />
            <rect x="15" y="15" width="3" height="3" fill="white" />
            <rect x="19" y="15" width="3" height="3" fill="white" />
            <rect x="15" y="19" width="3" height="3" fill="white" />
          </svg>
        </span>
        <span class="brand-name">QR Bin Inventory</span>
      </div>
    </div>

    <div class="app-header-right">
      @if (authService.currentManager(); as manager) {
        <span class="org-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 21V7l8-4 8 4v14" />
            <path d="M9 21v-6h6v6" />
          </svg>
          {{ manager.organizationName }}
        </span>
      }

      <div class="user-menu-wrap">
        <button type="button" class="user-trigger" (click)="toggleUserMenu()" [class.open]="userMenuOpen()">
          <span class="avatar">{{ initials() }}</span>
          <span class="user-role">Manager</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>

        @if (userMenuOpen()) {
          <div class="menu-backdrop" (click)="closeUserMenu()"></div>
          <div class="user-menu-dropdown">
            <div class="user-menu-header">
              <span class="avatar">{{ initials() }}</span>
              <div class="user-menu-identity">
                <strong>{{ authService.currentManager()?.fullName }}</strong>
                <span>{{ authService.currentManager()?.email }}</span>
              </div>
            </div>
            <button type="button" class="user-menu-item" (click)="logout()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              Sign out
            </button>
          </div>
        }
      </div>
    </div>
  </header>

  <div class="shell-body">
    @if (sidebarOpen()) {
      <div class="sidebar-backdrop" (click)="closeSidebar()"></div>
    }

    <nav class="sidebar" [class.open]="sidebarOpen()">
      <div class="nav-main">
        <a routerLink="/dashboard" routerLinkActive="active" (click)="closeSidebar()">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="9" rx="1" />
              <rect x="14" y="3" width="7" height="5" rx="1" />
              <rect x="14" y="12" width="7" height="9" rx="1" />
              <rect x="3" y="16" width="7" height="5" rx="1" />
            </svg>
          </span>
          Dashboard
        </a>
        <a routerLink="/inventory" routerLinkActive="active" (click)="closeSidebar()">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7.5 12 4l9 3.5-9 3.5-9-3.5Z" />
              <path d="M3 7.5v9l9 3.5 9-3.5v-9" />
              <path d="M12 11v9" />
            </svg>
          </span>
          Inventory
        </a>
        <a routerLink="/qr-labels" routerLinkActive="active" (click)="closeSidebar()">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <rect x="2" y="2" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="2" />
              <rect x="15" y="2" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="2" />
              <rect x="2" y="15" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="2" />
              <rect x="15" y="15" width="3" height="3" fill="currentColor" />
              <rect x="19" y="15" width="3" height="3" fill="currentColor" />
              <rect x="15" y="19" width="3" height="3" fill="currentColor" />
            </svg>
          </span>
          QR Labels
        </a>
      </div>

      <div class="nav-bottom">
        <button type="button" class="nav-link-btn" disabled title="Coming soon">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
            </svg>
          </span>
          Settings
        </button>
        <button type="button" class="nav-link-btn" (click)="logout()">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </span>
          Logout
        </button>
      </div>
    </nav>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
